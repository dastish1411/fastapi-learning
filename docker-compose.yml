services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: fastapi_learning
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://fastapi_user:fastapi_pass@db:5432/fastapi_learning
    ports:
      - "8000:8000"

volumes:
  pgdata: