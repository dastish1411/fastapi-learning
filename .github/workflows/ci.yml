name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: fastapi_learning
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: fastapi_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fastapi_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://fastapi_user:fastapi_pass@localhost:5432/fastapi_learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check
        run: python -m py_compile main.py auth.py database.py models.py

      - name: Import smoke test
        run: python -c "import main"

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fastapi-app:ci
